# ==============================================================================
#  B. 퍼블릭 로드맵 — Trello → data/quests.json  (빌드타임 스냅샷)
# ==============================================================================
#  왜 런타임 fetch가 아니라 이 방식인가:
#    - 토큰이 브라우저로 안 나간다 (런타임 fetch는 무조건 토큰이 노출된다)
#    - CORS 문제 자체가 없다 (사이트는 자기 오리진의 JSON만 읽는다)
#    - 트렐로가 죽어도 사이트는 마지막 스냅샷으로 멀쩡히 뜬다
#    - 커밋 히스토리에 남아서 사고 나면 revert 한 방
#
#  레포 설정:
#    Settings → Secrets and variables → Actions
#      Secrets:   TRELLO_KEY, TRELLO_TOKEN
#      Variables: TRELLO_BOARD_ID (공개용 보드의 shortLink 또는 id)
#                 TRELLO_GATE_LABEL (기본값 "#public")
#
#  ⚠ 게이트: 라벨이 정확히 일치하는 카드만 나간다. 기본값은 비공개.
#  ⚠ GitHub의 스케줄 워크플로는 레포가 60일간 무활동이면 자동 비활성화된다.
# ==============================================================================

name: Sync Trello → quests.json

on:
  schedule:
    - cron: '17 */6 * * *'   # 6시간마다 (정각은 혼잡해서 17분에)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: sync-trello
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch board from Trello
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          BOARD: ${{ vars.TRELLO_BOARD_ID }}
        run: |
          set -euo pipefail
          test -n "$BOARD" || { echo "::error::TRELLO_BOARD_ID 변수가 비어 있음"; exit 1; }
          curl -sS --fail-with-body --retry 3 --retry-delay 5 --max-time 30 \
            --get "https://api.trello.com/1/boards/${BOARD}/lists" \
            --data-urlencode "cards=open" \
            --data-urlencode "fields=name,pos" \
            --data-urlencode "card_fields=name,desc,labels,due,pos,shortUrl" \
            --data-urlencode "key=${TRELLO_KEY}" \
            --data-urlencode "token=${TRELLO_TOKEN}" \
            -o /tmp/raw.json
          test -s /tmp/raw.json

      - name: Filter by gate label → quests.json
        env:
          GATE: ${{ vars.TRELLO_GATE_LABEL || '#public' }}
        run: |
          set -euo pipefail
          mkdir -p data

          jq --arg gate "$GATE" '
            [ .[]
              | { list: .name,
                  pos: .pos,
                  cards: [ .cards[]
                    | select(any(.labels[]?; .name == $gate))
                    | { title: .name,
                        note: ((.desc // "") | split("\n---")[0] | gsub("^\\s+|\\s+$";"") | .[0:280]),
                        tags: [ .labels[]?.name | select(. != $gate and . != null and . != "") ],
                        due: .due,
                        url: .shortUrl }
                  ] }
            ]
            | map(select((.cards | length) > 0))
            | sort_by(.pos)
            | { schema: 1, lists: [ .[] | {list, cards} ] }
          ' /tmp/raw.json > /tmp/quests.json

          # 안전장치: 통과한 카드가 0개면 커밋하지 않는다.
          # (라벨 오타 / 토큰 만료 / 권한 변경으로 보드가 통째로 비는 사고 방지)
          COUNT=$(jq '[.lists[].cards[]] | length' /tmp/quests.json)
          echo "gate='$GATE' 통과 카드: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::게이트 통과 카드 0개 — 기존 quests.json 유지하고 종료"
            exit 0
          fi

          jq --sort-keys . /tmp/quests.json > data/quests.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/quests.json; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi
          git config user.name  "gghf-trello-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quests.json
          git commit -m "chore: sync quest board from Trello"
          git push
